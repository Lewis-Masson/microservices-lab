services:
  user-service:
    build: ./user-service
    ports: ["3000:3000"]
  video-service:
    build: ./video-service
    ports: ["3001:3001"]
  api-gateway:
    build: ./api-gateway
    environment:
      USER_SERVICE_URL: http://user-service:3000
      VIDEO_SERVICE_URL: http://video-service:3001
    ports: ["3002:3002"]
    depends_on: [user-service, video-service]
  frontend:
    build: ./frontend
    ports: ["3003:3000"]
    depends_on: [api-gateway]